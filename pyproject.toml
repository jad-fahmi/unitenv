[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unitenv"
version = "0.1.0"
description = "Explain environment variables for running systemd services"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Jad Fahmi", email = "jadfahmi07@gmail.com" }]
keywords = ["systemd", "environment", "linux", "diagnostics", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jad-fahmi/unitenv"
Repository = "https://github.com/jad-fahmi/unitenv"
Issues = "https://github.com/jad-fahmi/unitenv/issues"
Changelog = "https://github.com/jad-fahmi/unitenv/blob/main/CHANGELOG.md"

[project.scripts]
unitenv = "unitenv.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
